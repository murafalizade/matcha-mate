<script>
        // Simple swipe micro-interaction simulation
        const card = document.getElementById('active-card');
        const btnLike = document.getElementById('btn-like');
        const btnPass = document.getElementById('btn-pass');
        const container = document.getElementById('card-container');

        let isDragging = false;
        let startX = 0;
        let currentX = 0;

        card.addEventListener('mousedown', startDrag);
        card.addEventListener('touchstart', startDrag);

        function startDrag(e) {
            isDragging = true;
            startX = e.type === 'mousedown' ? e.clientX : e.touches[0].clientX;
            card.style.transition = 'none';
        }

        window.addEventListener('mousemove', drag);
        window.addEventListener('touchmove', drag);

        function drag(e) {
            if (!isDragging) return;
            currentX = e.type === 'mousemove' ? e.clientX : e.touches[0].clientX;
            const diff = currentX - startX;
            const rotation = diff / 20;
            card.style.transform = `translateX(${diff}px) rotate(${rotation}deg)`;
            
            // Visual feedback
            if (diff > 50) {
                card.style.borderColor = 'rgba(74, 222, 128, 0.5)'; // Greenish hint
            } else if (diff < -50) {
                card.style.borderColor = 'rgba(255, 107, 107, 0.5)'; // Coral hint
            } else {
                card.style.borderColor = 'transparent';
            }
        }

        window.addEventListener('mouseup', endDrag);
        window.addEventListener('touchend', endDrag);

        function endDrag() {
            if (!isDragging) return;
            isDragging = false;
            const diff = currentX - startX;
            
            if (Math.abs(diff) > 150) {
                const direction = diff > 0 ? 1 : -1;
                swipe(direction);
            } else {
                card.style.transition = 'transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275)';
                card.style.transform = 'translateX(0) rotate(0)';
                card.style.borderColor = 'transparent';
            }
        }

        function swipe(direction) {
            card.style.transition = 'transform 0.5s ease-in, opacity 0.3s';
            card.style.transform = `translateX(${direction * 1000}px) rotate(${direction * 45}deg)`;
            card.style.opacity = '0';
            
            setTimeout(() => {
                // Reset card for demo purposes
                card.style.transition = 'none';
                card.style.transform = 'translateX(0) rotate(0) scale(0.9)';
                card.style.opacity = '0';
                
                setTimeout(() => {
                    card.style.transition = 'transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.5s';
                    card.style.transform = 'scale(1)';
                    card.style.opacity = '1';
                    card.style.borderColor = 'transparent';
                }, 50);
            }, 500);
        }

        btnLike.addEventListener('click', () => swipe(1));
        btnPass.addEventListener('click', () => swipe(-1));
    </script>
