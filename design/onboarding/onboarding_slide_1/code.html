<style>
        body {
            background-color: #fff8f7;
            font-family: 'Plus Jakarta Sans', sans-serif;
            margin: 0;
            padding: 0;
            overflow: hidden;
            height: 100vh;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .coffee-shadow {
            box-shadow: 0px 10px 30px rgba(74, 44, 42, 0.08);
        }
        .glass-nav {
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }
        .carousel-container {
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .illustration-area {
            height: 55%;
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .content-area {
            flex: 1;
            padding: 20px 32px 48px 32px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            background: #fff8f7;
            border-top-left-radius: 32px;
            border-top-right-radius: 32px;
            margin-top: -32px;
            position: relative;
            z-index: 10;
        }
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }
        .floating {
            animation: float 4s ease-in-out infinite;
        }
    </style>
</head>
<body class="bg-background text-on-background">
<!-- Top Navigation Row (Skip) -->
<header class="fixed top-0 left-0 w-full z-50 flex justify-end items-center px-container-padding py-md pointer-events-none">
<button class="pointer-events-auto font-label-md text-label-md text-on-surface-variant hover:opacity-70 transition-opacity">
            Skip
        </button>
</header>
<main class="carousel-container">
<!-- Illustration Area (Top 55%) -->
<section class="illustration-area bg-surface-container-low">
<div class="absolute inset-0 z-0">
<!-- Atmospheric background element -->
<div class="absolute top-1/4 left-1/4 w-64 h-64 bg-primary-fixed opacity-20 blur-[100px] rounded-full"></div>
<div class="absolute bottom-1/4 right-1/4 w-48 h-48 bg-tertiary-fixed opacity-30 blur-[80px] rounded-full"></div>
</div>
<!-- Main Hero Image -->
<div class="relative z-10 w-full h-full p-lg flex items-center justify-center">
<img alt="" class="w-full h-full object-contain floating" src="https://lh3.googleusercontent.com/aida-public/AB6AXuC1D9cfJl29FQnSb7oggr16-LZ3Evc4pAd44_Bnu-Hu-z19o2eqDyCiLM59SIvG40A3dwVow-U-RFfsdEqqsBIrxTMTmtc-UubDe2bFMWR0CzR5htwd0aLagTzfRPL9PUpBfQWd8_i2f9jtp4zoz-W4KYw0DcBofeWvMRg1h7NP-Zw551u_wX1uI1qbaedNTDhRLmjgvkr0ZpboHEFtpFa3NruqTTPl4nhSwZgYYc4Vm_ismPeojGzqjIqJGQVpp-kMDtsy8C5dNMZ3"/>
</div>
</section>
<!-- Content Section -->
<section class="content-area coffee-shadow">
<div class="space-y-sm text-center pt-xs">
<!-- Headline -->
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-primary tracking-tight">Discover People Nearby</h1>
<!-- Description -->
<p class="font-body-md text-body-md text-on-surface-variant max-w-[280px] mx-auto">Find interesting people at cafés and venues around you — right now.</p>
</div>
<!-- Pagination Dots -->
<div class="flex justify-center items-center gap-xs">
<div class="w-2.5 h-2.5 rounded-full bg-primary-container"></div>
<div class="w-2 h-2 rounded-full bg-outline-variant"></div>
<div class="w-2 h-2 rounded-full bg-outline-variant"></div>
<div class="w-2 h-2 rounded-full bg-outline-variant"></div>
</div>
<!-- Primary Action Button -->
<div class="w-full">
<button class="w-full h-[56px] bg-on-tertiary-container hover:bg-tertiary-container text-white font-label-md text-label-md rounded-xl transition-all duration-300 active:scale-95 flex items-center justify-center gap-base">
                    Next
                    <span class="material-symbols-outlined text-sm">arrow_forward</span>
</button>
</div>
</section>
</main>
<!-- Subtle Background Pattern Overlay -->
<div class="fixed inset-0 pointer-events-none opacity-[0.03] z-[0]" style="background-image: radial-gradient(#4a2c2a 1px, transparent 1px); background-size: 24px 24px;"></div>
<script>
        // Simple micro-interaction for the button
        const nextBtn = document.querySelector('button.bg-on-tertiary-container');
        nextBtn.addEventListener('mousedown', () => {
            nextBtn.classList.add('scale-98');
        });
        nextBtn.addEventListener('mouseup', () => {
            nextBtn.classList.remove('scale-98');
        });
        
        // Haptic-like feedback on pagination dots (visual only)
        const dots = document.querySelectorAll('.flex.justify-center.items-center.gap-xs div');
        dots.forEach((dot, index) => {
            dot.addEventListener('click', () => {
                dots.forEach(d => {
                    d.classList.remove('bg-primary-container', 'w-2.5', 'h-2.5');
                    d.classList.add('bg-outline-variant', 'w-2', 'h-2');
                });
                dot.classList.remove('bg-outline-variant', 'w-2', 'h-2');
                dot.classList.add('bg-primary-container', 'w-2.5', 'h-2.5');
            });
        });
    </script>
</body></html>
