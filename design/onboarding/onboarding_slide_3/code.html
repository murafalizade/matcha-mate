<script>
        // Simple Interaction Logic
        document.addEventListener('DOMContentLoaded', () => {
            const nextBtn = document.querySelector('button.bg-[#CD8F62]');
            const skipBtn = document.querySelector('header button');

            nextBtn.addEventListener('click', () => {
                // Ripple/Scale effect handled by Tailwind classes,

                console.log('Navigating to next onboarding slide...');
