<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        body {
            background-color: #f5f0ee; /* Soft coffee tint for global background */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        /* Mobile Frame Simulator */
        .phone-canvas {
            width: 100%;
            max-width: 414px;
            height: 100vh;
            max-height: 896px;
            background: #fff8f7; /* Latte Beige */
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        .btn-hover:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body class="antialiased">
<!-- Main Onboarding Container (The "Canvas") -->
<div class="phone-canvas shadow-2xl md:rounded-[3rem] border-white/20">
<!-- Header Actions: Skip -->
<div class="absolute top-0 right-0 p-container-padding z-50">
<button class="font-label-md text-label-md text-on-surface-variant hover:text-primary transition-colors py-2 px-4">
                Skip
            </button>
</div>
<!-- Illustration Section (55% Height) -->
<div class="h-[55%] w-full relative overflow-hidden bg-surface-container-low">
<!-- Full Width Illustration Placeholder -->
<img alt="Onboarding Illustration" class="w-full h-full object-cover" src="https://lh3.googleusercontent.com/aida-public/AB6AXuADCQsKwxNjCv4hI1G98I0eyXYY1jm2ZOIJRIAl0TTX_yn2nClcmOcWlNK_ZR5QIdKK_tzkUdxasNLljbyuPWKnHF1wYhPQdVM3Mf2sBQCymDXENi_VmzIh1T3Kp8NN9vtm2TnHEANlmrVemoqIDtcyifb0_Fntq8PMeIlF3i39V9XDXcX0KMSYeausFNlyvGZhM1aANPPXstp0IiakCyZdTmrqgzy2L0TwS9CuZugU95zvl-levV2wG5p1pUxFkAJ15EhwUNGfktOY"/>
<!-- Subtle Atmospheric Overlay -->
<div class="absolute inset-0 bg-gradient-to-t from-surface-container-low/80 to-transparent"></div>
</div>
<!-- Content Section -->
<div class="flex-1 flex flex-col items-center justify-between px-container-padding py-xl text-center">
<!-- Text Content -->
<div class="space-y-sm max-w-[280px]">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-primary leading-tight">
                    Swipe to Connect
                </h1>
<p class="font-body-md text-body-md text-on-surface-variant">
                    Like who you vibe with. When you both swipe right, it's a match.
                </p>
</div>
<!-- Footer Section: Dots & Button -->
<div class="w-full space-y-xl">
<!-- Pagination Dots (Slide 2 of 4) -->
<div class="flex justify-center gap-xs">
<div class="w-2 h-2 rounded-full bg-secondary-fixed-dim"></div>
<div class="w-6 h-2 rounded-full bg-on-tertiary-container transition-all"></div>
<div class="w-2 h-2 rounded-full bg-secondary-fixed-dim"></div>
<div class="w-2 h-2 rounded-full bg-secondary-fixed-dim"></div>
</div>
<!-- Primary Action Button (Caramel Theme) -->
<div class="w-full">
<button class="w-full h-[56px] bg-on-tertiary-container hover:bg-tertiary-container text-white font-headline-md text-body-lg rounded-xl shadow-[0px_10px_30px_rgba(74,44,42,0.12)] transition-all duration-200 btn-hover flex items-center justify-center gap-base">
                        Next
                        <span class="material-symbols-outlined text-[20px]">arrow_forward</span>
</button>
</div>
</div>
</div>
<!-- Safe Area Decor (Physical Home Indicator for aesthetics) -->
<div class="w-1/3 h-1.5 bg-outline-variant/30 rounded-full mx-auto mb-2"></div>
</div>
<!-- Micro-interaction Script -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const button = document.querySelector('.btn-hover');
            
            // Subtle entrance animation for text
            const content = document.querySelector('.space-y-sm');
            content.style.opacity = '0';
            content.style.transform = 'translateY(20px)';
            
            setTimeout(() => {
                content.style.transition = 'all 0.6s cubic-bezier(0.22, 1, 0.36, 1)';
                content.style.opacity = '1';
                content.style.transform = 'translateY(0)';
            }, 100);

            // Button tap effect
            button.addEventListener('touchstart', () => {
                button.style.transform = 'scale(0.96)';
            });
            button.addEventListener('touchend', () => {
                button.style.transform = 'scale(1)';
            });
        });
    </script>
</body></html>
