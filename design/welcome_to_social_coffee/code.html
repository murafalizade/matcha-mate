<style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            -webkit-font-smoothing: antialiased;
            background-color: #f5eceb; /* Tonal variation of the background */
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .fade-in {
            animation: fadeIn 0.8s ease-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        /* Custom elevation for hygge feel */
        .hygge-shadow {
            box-shadow: 0px 10px 30px rgba(74, 44, 42, 0.08);
        }
        .hygge-button-transition {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
    </style>
</head>
<body class="flex flex-col min-h-screen">
<!-- Top Navigation Shell (Hidden on Landing per UX rules, but available via TopAppBar JSON guidance for identity) -->
<header class="w-full top-0 sticky bg-transparent flex items-center justify-center w-full px-container-padding py-sm z-10">
<div class="flex flex-col items-center">
<span class="material-symbols-outlined text-primary text-headline-lg mb-1" style="font-variation-settings: 'FILL' 1;">coffee</span>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-primary tracking-tight">Social Coffee</h1>
</div>
</header>
<!-- Main Canvas Area -->
<main class="flex-grow flex flex-col items-center justify-between px-container-padding pb-xl fade-in">
<!-- Upper-Middle Section -->
<div class="text-center mt-md max-w-sm">
<p class="font-body-lg text-body-lg text-on-surface-variant opacity-90">Meet people over coffee, not screens.</p>
</div>
<!-- Middle Section: Hero Illustration -->
<div class="w-full max-w-md flex justify-center items-center py-lg flex-grow">
<div class="relative w-full aspect-square overflow-hidden rounded-xl hygge-shadow">
<img alt="Social Coffee Community Illustration" class="w-full h-full object-cover" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBmhFxUZd-IqsijpaWEbKQre2D37VrRGUZVn62C1DhSzDEVhiIeqfjswMdbi4agTjqWIiYAWDwt7UrPEdm0G99vVi9MMa2wn0eROu79AFdkewklE5ZXh5G_DdDc9AKVZCUrqY6P6i-KqywyayaDQX295efOchpW0TcIzOJfumT9Lla8xpeki6b9ztsilr-JmMGvjrxy1PF9usAW4mv1smzjKOx9Fjz6J5tXFHdwF25wEtkmoDWQnlCdIQYn7fdjoNdrWAShm6r9eYgz"/>
</div>
</div>
<!-- Bottom Section: Actions -->
<div class="w-full max-w-md flex flex-col gap-sm">
<!-- Primary Button: Sign Up -->
<button class="w-full h-[56px] bg-[#C88A5E] text-white font-label-md text-label-md rounded-xl shadow-lg hygge-button-transition active:scale-95 hover:opacity-90 flex items-center justify-center">
                Sign Up
            </button>
<!-- Secondary Button: Log In -->
<button class="w-full h-[56px] border-2 border-primary text-primary font-label-md text-label-md rounded-xl bg-transparent hygge-button-transition active:scale-95 hover:bg-primary/5 flex items-center justify-center">
                Log In
            </button>
</div>
<!-- Footer -->
<footer class="mt-lg px-md text-center">
<p class="font-label-sm text-label-sm text-on-surface-variant/70 leading-relaxed">
                By continuing you agree to our <br/>
<a class="underline font-semibold text-primary" href="#">Terms</a> &amp; <a class="underline font-semibold text-primary" href="#">Privacy Policy</a>.
            </p>
</footer>
</main>
<!-- Interactive Layer: Coffee Steam Effect (Subtle Micro-interaction) -->
<div class="fixed inset-0 pointer-events-none opacity-20 overflow-hidden -z-10">
<div class="absolute -bottom-20 -left-20 w-64 h-64 bg-primary/10 rounded-full blur-3xl animate-pulse"></div>
<div class="absolute top-40 -right-20 w-48 h-48 bg-tertiary-fixed-dim/20 rounded-full blur-3xl" style="animation: float 10s infinite ease-in-out"></div>
</div>
<script>
        // Micro-interaction for the floating background element
        const style = document.createElement('style');
        style.textContent = `
            @keyframes float {
                0%, 100% { transform: translateY(0) translateX(0); }
                50% { transform: translateY(-30px) translateX(20px); }
            }
        `;
        document.head.appendChild(style);

        // Simple log in redirect simulation for visual feel
        document.querySelectorAll('button').forEach(btn => {
            btn.addEventListener('click', () => {
                btn.classList.add('scale-95');
                setTimeout(() => btn.classList.remove('scale-95'), 150);
            });
        });
    </script>
</body></html>
