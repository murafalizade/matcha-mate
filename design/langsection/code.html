<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Social Coffee - Language Selection</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #fff8f7; /* Latte Beige / Background token */
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .active-selection {
            border: 2px solid #C88A5E; /* Soft Caramel active border */
            box-shadow: 0px 10px 30px rgba(74, 44, 42, 0.08);
        }
    </style>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "surface-container-high": "#efe6e5",
                    "surface-container-low": "#fbf2f0",
                    "inverse-on-surface": "#f8efee",
                    "on-primary-container": "#bd928f",
                    "tertiary-fixed": "#ffdcc6",
                    "secondary-fixed": "#ebe1d6",
                    "surface-container-lowest": "#ffffff",
                    "on-primary": "#ffffff",
                    "secondary-container": "#ebe1d6",
                    "primary": "#321716",
                    "on-tertiary": "#ffffff",
                    "tertiary": "#351700",
                    "surface-bright": "#fff8f7",
                    "on-surface-variant": "#504443",
                    "on-secondary": "#ffffff",
                    "primary-fixed": "#ffdad7",
                    "on-error-container": "#93000a",
                    "error": "#ba1a1a",
                    "tertiary-container": "#532905",
                    "primary-container": "#4a2c2a",
                    "outline-variant": "#d4c3c1",
                    "surface-tint": "#795553",
                    "on-surface": "#1e1b1a",
                    "inverse-surface": "#342f2f",
                    "surface": "#fff8f7",
                    "on-primary-fixed-variant": "#5f3e3c",
                    "on-secondary-fixed": "#1f1b14",
                    "on-primary-fixed": "#2e1413",
                    "on-tertiary-container": "#cd8f62",
                    "surface-container-highest": "#e9e1df",
                    "outline": "#827472",
                    "surface-variant": "#e9e1df",
                    "on-tertiary-fixed": "#301400",
                    "on-background": "#1e1b1a",
                    "surface-container": "#f5eceb",
                    "background": "#fff8f7",
                    "on-secondary-fixed-variant": "#4c463e",
                    "tertiary-fixed-dim": "#fcb888",
                    "surface-dim": "#e1d8d7",
                    "secondary-fixed-dim": "#cec5bb",
                    "secondary": "#645d55",
                    "primary-fixed-dim": "#eabcb8",
                    "on-error": "#ffffff",
                    "on-tertiary-fixed-variant": "#6a3b16",
                    "on-secondary-container": "#6a635b",
                    "error-container": "#ffdad6",
                    "inverse-primary": "#eabcb8"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "16px",
                    "full": "9999px"
            },
            "spacing": {
                    "md": "24px",
                    "sm": "16px",
                    "xs": "8px",
                    "xl": "48px",
                    "container-padding": "20px",
                    "base": "4px",
                    "card-gap": "16px",
                    "lg": "32px"
            },
            "fontFamily": {
                    "label-sm": ["Plus Jakarta Sans"],
                    "body-md": ["Plus Jakarta Sans"],
                    "label-md": ["Plus Jakarta Sans"],
                    "headline-lg-mobile": ["Plus Jakarta Sans"],
                    "body-lg": ["Plus Jakarta Sans"],
                    "headline-md": ["Plus Jakarta Sans"],
                    "headline-lg": ["Plus Jakarta Sans"],
                    "display-lg": ["Plus Jakarta Sans"]
            },
            "fontSize": {
                    "label-sm": ["12px", {"lineHeight": "16px", "fontWeight": "500"}],
                    "body-md": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                    "label-md": ["14px", {"lineHeight": "20px", "letterSpacing": "0.05em", "fontWeight": "600"}],
                    "headline-lg-mobile": ["28px", {"lineHeight": "36px", "fontWeight": "700"}],
                    "body-lg": ["18px", {"lineHeight": "28px", "fontWeight": "400"}],
                    "headline-md": ["24px", {"lineHeight": "32px", "fontWeight": "700"}],
                    "headline-lg": ["32px", {"lineHeight": "40px", "letterSpacing": "-0.01em", "fontWeight": "700"}],
                    "display-lg": ["40px", {"lineHeight": "48px", "letterSpacing": "-0.02em", "fontWeight": "800"}]
            }
          },
        },
      }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background min-h-screen flex flex-col items-center">
<!-- Top AppBar / Logo Section -->
<header class="w-full max-w-md px-container-padding pt-xl pb-md flex flex-col items-center text-center">
<div class="flex items-center justify-center mb-md">
<span class="material-symbols-outlined text-primary text-[40px]" style="font-variation-settings: 'FILL' 1;">coffee</span>
<h1 class="font-headline-md text-headline-md font-bold text-primary ml-xs">Social Coffee</h1>
</div>
<div class="flex flex-col gap-1 opacity-80">
<p class="font-label-sm text-label-sm text-primary uppercase tracking-widest">Choose your language</p>
<p class="font-label-sm text-label-sm text-primary uppercase tracking-widest">Dilinizi seçin</p>
<p class="font-label-sm text-label-sm text-primary uppercase tracking-widest">Выберите язык</p>
</div>
</header>
<!-- Language Selection Canvas -->
<main class="w-full max-w-md px-container-padding flex-1">
<div class="space-y-card-gap mt-md">
<!-- Option 1: Turkish -->
<button class="w-full flex items-center justify-between p-md bg-surface-container-lowest rounded-xl border-2 border-transparent transition-all duration-200 group hover:bg-surface-container-low shadow-[0px_10px_30px_rgba(74,44,42,0.04)]" onclick="selectLanguage(this)">
<div class="flex items-center gap-md">
<div class="w-10 h-10 rounded-full overflow-hidden flex items-center justify-center bg-secondary-container">
<span class="text-2xl">🇹🇷</span>
</div>
<span class="font-body-lg text-body-lg text-on-surface font-semibold">Türkçe</span>
</div>
<div class="w-6 h-6 rounded-full border-2 border-outline-variant flex items-center justify-center transition-colors group-[.active-selection]:bg-[#C88A5E] group-[.active-selection]:border-[#C88A5E]">
<span class="material-symbols-outlined text-white text-sm hidden group-[.active-selection]:block">check</span>
</div>
</button>
<!-- Option 2: Russian -->
<button class="w-full flex items-center justify-between p-md bg-surface-container-lowest rounded-xl border-2 border-transparent transition-all duration-200 group hover:bg-surface-container-low shadow-[0px_10px_30px_rgba(74,44,42,0.04)]" onclick="selectLanguage(this)">
<div class="flex items-center gap-md">
<div class="w-10 h-10 rounded-full overflow-hidden flex items-center justify-center bg-secondary-container">
<span class="text-2xl">🇷🇺</span>
</div>
<span class="font-body-lg text-body-lg text-on-surface font-semibold">Русский</span>
</div>
<div class="w-6 h-6 rounded-full border-2 border-outline-variant flex items-center justify-center transition-colors group-[.active-selection]:bg-[#C88A5E] group-[.active-selection]:border-[#C88A5E]">
<span class="material-symbols-outlined text-white text-sm hidden group-[.active-selection]:block">check</span>
</div>
</button>
<!-- Option 3: English (ACTIVE) -->
<button class="active-selection w-full flex items-center justify-between p-md bg-surface-container-lowest rounded-xl border-2 transition-all duration-200 group hover:bg-surface-container-low shadow-[0px_10px_30px_rgba(74,44,42,0.08)]" onclick="selectLanguage(this)">
<div class="flex items-center gap-md">
<div class="w-10 h-10 rounded-full overflow-hidden flex items-center justify-center bg-secondary-container">
<span class="text-2xl">🇬🇧</span>
</div>
<span class="font-body-lg text-body-lg text-on-surface font-semibold">English</span>
</div>
<div class="w-6 h-6 rounded-full bg-[#C88A5E] border-2 border-[#C88A5E] flex items-center justify-center transition-colors">
<span class="material-symbols-outlined text-white text-sm">check</span>
</div>
</button>
</div>
</main>
<!-- Action Footer -->
<footer class="w-full max-w-md px-container-padding py-xl">
<button class="w-full h-14 bg-[#C88A5E] hover:bg-[#b07850] active:scale-95 text-white font-label-md text-label-md rounded-full shadow-lg transition-all duration-200 uppercase tracking-widest">
            Continue
        </button>
</footer>
<!-- Decorative Element: Warm minimal background texture -->
<div class="fixed inset-0 -z-10 opacity-20 pointer-events-none overflow-hidden">
<div class="absolute top-[-10%] right-[-10%] w-96 h-96 rounded-full bg-secondary-fixed blur-3xl opacity-50"></div>
<div class="absolute bottom-[-10%] left-[-10%] w-80 h-80 rounded-full bg-tertiary-fixed blur-3xl opacity-30"></div>
</div>
<script>
        function selectLanguage(element) {
            // Remove active classes from all siblings
            const buttons = element.parentElement.querySelectorAll('button');
            buttons.forEach(btn => {
                btn.classList.remove('active-selection');
                btn.classList.remove('shadow-[0px_10px_30px_rgba(74,44,42,0.08)]');
                btn.classList.add('border-transparent');
                
                // Reset checkmark container
                const checkContainer = btn.querySelector('div:last-child');
                checkContainer.classList.remove('bg-[#C88A5E]', 'border-[#C88A5E]');
                checkContainer.classList.add('border-outline-variant');
                
                const icon = checkContainer.querySelector('span');
                icon.classList.add('hidden');
            });

            // Add active classes to selected
            element.classList.add('active-selection');
            element.classList.remove('border-transparent');
            element.classList.add('shadow-[0px_10px_30px_rgba(74,44,42,0.08)]');
            
            const selectedCheck = element.querySelector('div:last-child');
            selectedCheck.classList.add('bg-[#C88A5E]', 'border-[#C88A5E]');
            selectedCheck.classList.remove('border-outline-variant');
            
            const selectedIcon = selectedCheck.querySelector('span');
            selectedIcon.classList.remove('hidden');
        }
    </script>
</body></html>
